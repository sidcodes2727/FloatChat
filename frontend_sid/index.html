    <div id="root"></div>
    <!-- Dev helper: point API to backend on port 3001 when running on localhost -->
    <script>
      (function(){
        try {
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            window.__API_BASE__ = 'http://localhost:3001';
          }
        } catch (e) { /* noop */ }
      })();
    </script>
