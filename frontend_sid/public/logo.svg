<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#030b17" />
  
  <!-- Cyber-Nautical Waves -->
  <path d="M 15 65 Q 32.5 45, 50 65 T 85 65" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" filter="url(#blurGlow)" />
  <path d="M 15 80 Q 32.5 60, 50 80 T 85 80" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  
  <!-- ARGO Float Representation -->
  <!-- Main float body -->
  <circle cx="50" cy="40" r="10" fill="none" stroke="#00d4ff" stroke-width="4" filter="url(#blurGlow)" />
  <!-- Inner sensor dot -->
  <circle cx="50" cy="40" r="4" fill="#00d4ff" />
  
  <!-- Antenna -->
  <line x1="50" y1="18" x2="50" y2="30" stroke="#00d4ff" stroke-width="3.5" stroke-linecap="round" filter="url(#blurGlow)" />
  <!-- Antenna tip glow -->
  <circle cx="50" cy="15" r="3" fill="#a3e635" filter="url(#blurGlow)" />
  
  <!-- Data nodes on waves -->
  <circle cx="32.5" cy="55" r="2.5" fill="#f87171" filter="url(#blurGlow)" />
  <circle cx="67.5" cy="55" r="2.5" fill="#facc15" filter="url(#blurGlow)" />
</svg>
